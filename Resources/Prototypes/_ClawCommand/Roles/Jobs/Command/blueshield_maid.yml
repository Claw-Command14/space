- type: job
  id: BlueshieldMaid
  name: Claw Command Maid
  description: "Act as a servant and comforter for Command and CentCom VIPs."
  playTimeTracker: JobBlueshieldMaid
  requirements:
    - !type:DepartmentTimeRequirement
      department: Command
      min: 6550 # 1.625 hours
    - !type:DepartmentTimeRequirement
      department: Medical
      min: 13500 # 3.25 hours
    - !type:DepartmentTimeRequirement
      department: Security
      min: 13500 # 3.25 hours
  weight: 20
  startingGear: BlueshieldMaidGear
  icon: "JobIconClawCommandMaid"
  requireAdminNotify: true
  joinNotifyCrew: true
  supervisors: job-supervisors-command
  canBeAntag: false
  access:
  - External # Generic
  - Cryogenics
  - Maintenance 
  - Bar # Service, except mime and clown becasue CCM shouldnt be a fool.
  - Kitchen
  - Hydroponics
  - Service
  - Janitor
  - Theatre
  - Chapel 
  - Lawyer
  - Boxer
  - Library 
  - Musician 
  - Reporter 
  - Zookeeper
  - Engineering # Engi - no atmos, becasue >:3
  - Cargo # Cargo - no salvage, becasue maid is supposed to stay on station
  - Mail
  - Orders 
  - Research # Science, no Mantis
  - Command
  - BlueshieldMaid 
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: BlueshieldMaidGear
  equipment:
    back: ClothingBackpackBlueshield
    jumpsuit: ClothingUniformJumpskirtJanimaidmini
    shoes: ClothingShoesBootsCombatFilled
    eyes: ClothingEyesGlassesMedSec
    head: ClothingHeadHatCatEarsCosmetic
    gloves: ClothingHandsGlovesColorWhite
    id: BlueshieldPDA
    ears: ClothingHeadsetAltCommand
    #pocket1: UniqueBlueshieldOfficerLockerTeleporter
    #outerClothing: ClothingOuterArmorDuraVest
    #belt: ClothingBeltKatanaSheathFilledMaid
  storage:
    back:
    - AdvMopItem # removed zipties, CCM is not security
    - MegaSprayBottleSpaceCleaner
    #outerClothing: ClothingBlueshieldArmourVest
    #ears: ClothingHeadsetAltCommand
    #belt: ClothingBeltSecurityFilled
    #pocket1: WeaponPistolMk58
    #pocket2: DeathAcidifierImplanter
