- type: entity
  #parent: FireAxeCabinet
  id: SpareIdCabinet
  name: spare id cabinet
  description: There is a small label that reads "Indestructible".
  components:
    - type: WallMount
    - type: Clickable
    - type: InteractionOutline
    - type: Appearance
    - type: Lock
    - type: ItemSlots
    - type: ContainerContainer
      containers:
        ItemCabinet: !type:ContainerSlot
      placement:
        mode: SnapgridCenter
    - type: Sprite
      sprite: DeltaV/Structures/Wallmounts/idcard_cabinet.rsi
      layers:
        - state: cabinet
        - state: card
          map: ["enum.ItemCabinetVisualLayers.ContainsItem"]
          visible: true
        - state: glass
          map: ["enum.ItemCabinetVisualLayers.Door"]
    - type: ItemCabinet
      cabinetSlot:
        ejectOnInteract: true
        whitelist:
          components:
            - IdCard
    - type: AccessReader
      access: [["DV-SpareSafe"]]
    - type: SpareIDSafe

- type: entity
  id: SpareIdCabinetFilled
  parent: [SpareIdCabinet]
  suffix: Filled
  components:
    - type: ItemCabinet
      cabinetSlot:
        startingItem: CaptainIDCard
        ejectOnInteract: true
        whitelist:
          components:
            - IdCard
